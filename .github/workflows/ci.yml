name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the same version used locally (LLVM 19.1.5) to keep results identical.
      - name: Install clang-format
        run: pip install clang-format==19.1.5
      - name: Check formatting
        shell: pwsh
        run: ./tools/format.ps1 -Check

  assets:
    name: asset license registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the registry against assets/
        run: python3 tools/check_assets.py
      - name: Check the geodata manifest (no downloads)
        run: python3 tools/geo/geo_manifest.py
      - name: Test the checker
        run: python3 -m unittest discover -s tests/tools -v
      - name: Check generated tables are up to date
        run: python3 tools/gen_tables.py --check

  # Content and localisation lint (E4-T08, docs/dev/contentlint.md): a minimal Linux build of the tool
  # alone (no tests, no benchmarks, no engine), then data/ is checked with warnings as errors. The
  # annotations show up on the changed lines of the pull request. The corpus tests (the linter must fail on
  # broken input) run in the ctest runs of the build jobs.
  contentlint:
    name: contentlint (data/ and localisation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          args: --preset linux-gcc -DPATRIARCH_BUILD_TESTS=OFF -DPATRIARCH_BUILD_BENCHMARKS=OFF
      - name: Build contentlint
        run: cmake --build --preset linux-gcc --target contentlint
      - name: Lint data/
        run: out/linux-gcc/tools/contentlint/contentlint --root data --strict --format github

  windows-msvc:
    name: MSVC ${{ matrix.preset }}
    # windows-2022 ships Visual Studio 2022 (the "Visual Studio 17 2022" generator used by the presets).
    # Do not use windows-latest/windows-2025: those labels now point to the Visual Studio 2026 image.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, relwithdebinfo]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          args: --preset win-msvc
      - name: Build
        run: cmake --build --preset win-msvc-${{ matrix.preset }}
      - name: Test
        run: ctest --preset win-msvc-${{ matrix.preset }}
      # Same check as the Linux job, so the hashes of both platforms appear in the logs.
      - name: Compare hashes with the golden values
        shell: pwsh
        run: |
          $simcli = (Get-ChildItem out/win-msvc/tools -Recurse -Filter simcli.exe | Select-Object -First 1).FullName
          python tools/check_golden_hash.py $simcli
      - name: Check the schema reference is up to date
        if: matrix.preset == 'debug'
        run: out/win-msvc/tools/schemadoc/Debug/schemadoc.exe --check docs/dev/data-reference.md
      - name: Upload benchmark smoke results
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke-msvc-${{ matrix.preset }}
          path: out/win-msvc/bench/*/bench-smoke.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-msvc-${{ matrix.preset }}
          path: out/win-msvc/Testing
          retention-days: 7
          if-no-files-found: ignore

  # Cross-platform determinism (NFR-DET-1, issue #31): the simulation core, tools and tests are built
  # without the engine (no SDL3/RmlUi) with GCC and Clang, and the hashes must equal the golden values
  # that were pinned on MSVC.
  linux-determinism:
    name: Linux ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, build_type: RelWithDebInfo }
          - { compiler: gcc, build_type: Debug }
          - { compiler: clang, build_type: RelWithDebInfo }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }} --version
      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          args: --preset linux-${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        # -k 0: report every compile error of a run, not just the first batch.
        run: cmake --build --preset linux-${{ matrix.compiler }} -- -k 0
      - name: Test
        run: ctest --preset linux-${{ matrix.compiler }}
      - name: Compare hashes with the golden values
        run: python3 tools/check_golden_hash.py out/linux-${{ matrix.compiler }}/tools/simcli
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-linux-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: out/linux-${{ matrix.compiler }}/Testing
          retention-days: 7
          if-no-files-found: ignore

  # Second Windows compiler (issue #30): clang-cl from the "C++ Clang tools for Windows" component of the
  # Visual Studio 2022 image (ClangCL platform toolset). The whole project including the engine is built with
  # warnings as errors; the golden hashes pinned on MSVC must come out identical (NFR-DET-1).
  windows-clangcl:
    name: clang-cl ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, relwithdebinfo]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $llvm = & $vswhere -latest -products * -find 'VC\Tools\Llvm\x64\bin\clang-cl.exe'
          Write-Host "clang-cl: $llvm"
          & $llvm --version
      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          args: --preset win-clangcl
      - name: Build
        run: cmake --build --preset win-clangcl-${{ matrix.preset }}
      - name: Test
        run: ctest --preset win-clangcl-${{ matrix.preset }}
      - name: Compare hashes with the golden values
        shell: pwsh
        run: |
          $simcli = (Get-ChildItem out/win-clangcl/tools -Recurse -Filter simcli.exe | Select-Object -First 1).FullName
          python tools/check_golden_hash.py $simcli
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-clangcl-${{ matrix.preset }}
          path: out/win-clangcl/Testing
          retention-days: 7
          if-no-files-found: ignore

  # Static analysis (issue #30). Report-only for now: the job never fails the build; the number of findings is
  # written to the job summary and the full log is uploaded. Only src/ is analysed, using the compile database of
  # the Linux Clang preset (Ninja writes compile_commands.json; the Visual Studio generator cannot).
  clang-tidy:
    name: clang-tidy (report only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Install clang-tidy
        run: |
          if ! command -v run-clang-tidy-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-tidy-18
          fi
          clang-tidy-18 --version
      - name: Configure (compile_commands.json)
        uses: ./.github/actions/cmake-configure
        with:
          args: --preset linux-clang
      - name: Run clang-tidy over src/
        run: |
          mkdir -p tidy-report
          run-clang-tidy-18 -p out/linux-clang -j "$(nproc)" -quiet \
            -clang-tidy-binary "$(command -v clang-tidy-18)" \
            "$GITHUB_WORKSPACE/src/.*\.cpp$" > tidy-report/clang-tidy.txt 2>&1 || true
      - name: Summarize findings
        run: python3 tools/clang_tidy_summary.py tidy-report/clang-tidy.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload clang-tidy report
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-report
          path: tidy-report
          retention-days: 14
          if-no-files-found: error

  windows-asan:
    name: MSVC AddressSanitizer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          args: --preset win-msvc-asan
      - name: Build
        run: cmake --build --preset win-msvc-asan-debug
      - name: Test
        run: ctest --preset win-msvc-asan-debug
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-msvc-asan
          path: out/win-msvc-asan/Testing
          retention-days: 7
          if-no-files-found: ignore
